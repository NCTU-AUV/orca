# 現行做法：ROS 2 全部跑在筆電，RPi 不跑 ROS、只當轉接（見 docs/architecture.md）。
#   相機：RPi cam-relay（TCP 5600）→ front_camera
#   飛控：RPi mavproxy（UDP 14560，udpin）↔ fc_adapter 裡的 mavros
# 兩條連線都由筆電主動發起，筆電不用開防火牆。所有節點在同一台，ROS_LOCALHOST_ONLY=1，DDS 不出網路。
#
#   ./up.sh                                       # 開場次（或沿用）、起服務、開始全程錄影，等就緒；映像不存在或過期才 build，已經在跑的不重開
#   ./mission.sh                                  # 過門（行為樹，mission 服務，會先跑 ./up.sh）；解鎖前會等你按 Enter
#   ./pool_test.sh water_depth                    # 水池測試腳本
#   ./mark.sh <內容>                              # 插一筆標記
#   ./down.sh                                     # 收工：場次收尾（停錄影、存終端輸出、參數快照）再關掉全部。不要直接 docker compose down
#   docker compose up -d front_camera object_detector   # 只跑影像（飛控沒接時，不開場次、不錄）
#
# 服務：
#   front_camera     接 RPi 轉出的 D435i 影像 → /camera/camera/color/*（topic 同 realsense2_camera）
#   object_detector  RF-DETR：影像 → /detections
#   fc_adapter       飛控介面：mavros + auv_adapter（/auv_control → ArduSub）。程式不改
#   recorder         全程把所有 topic 錄成 rosbag（MCAP），錄進目前場次
#   marker_log       把標記（/session/marker）寫進目前場次的 markers.csv
#   mission          行為樹決策層（orca_mission）：/detections + mavros 狀態 → /auv_control
#   gui_tools        rqt、鍵盤操控、回放與切片 rosbag 等臨時工具
# 紀錄：logs/session/<場次>/，目前場次的名稱在 logs/session/current。目錄結構見 deploy/common.sh 檔頭，
# 用法見 docs/laptop-rpi-relay.md 的「紀錄」。容器都掛整個 logs/session/（/sessions），程式寫檔時才讀 current：
# 容器的 volume 在建立時就固定了，fc_adapter 這種常駐的容器會跨場次。
# 底部相機：RPi 轉接還沒有底部相機那一路；接上之後發 /bottom_camera/image_raw、camera_info
#（frame_id bottom_camera_optical_frame），object_detector、mission 不用改。
name: orca

x-ros: &ros
  network_mode: host
  # Fast DDS 在同一台機器上走共享記憶體（/dev/shm）；容器各自有 /dev/shm 時
  # 互相看得到 topic 卻收不到資料，所以全部共用主機的 IPC
  ipc: host
  init: true
  environment: &ros-env
    ROS_LOCALHOST_ONLY: "1"
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}

x-base: &base
  image: orca-base
  build:
    context: ../..
    dockerfile: docker/base.Dockerfile
    # build 指紋（docker/build-hash.sh 算的）。up.sh 比對它決定要不要重 build；直接 compose build 時是空的
    labels:
      orca.build-hash: ${ORCA_BASE_HASH:-}

services:
  # RPi cam-relay → /camera/camera/color/image_raw、camera_info（topic 名稱同 realsense2_camera）
  front_camera:
    <<: [*ros, *base]
    restart: on-failure     # 程式出錯結束就重開；compose stop／down 不受影響
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../../src:/opt/orca_ws/src:ro
    command: [ros2, run, orca_cam_bridge, cam_bridge, --ros-args, -p, "host:=${RPI_HOST:-10.42.0.1}"]

  # RF-DETR：影像 → /detections（vision_msgs/Detection2DArray）、/detections/image（畫好框；.../compressed 是 JPEG）
  # 權重先跑 ml/rfdetr/fetch_weights.sh 下載
  object_detector:
    <<: *ros
    image: orca-perception
    build:
      context: ../..
      dockerfile: docker/perception-x86.Dockerfile
      labels:
        orca.build-hash: ${ORCA_PERCEPTION_HASH:-}
    gpus: all
    restart: on-failure     # 程式出錯結束就重開（重開要重新載入模型）；compose stop／down 不受影響
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../../src:/opt/orca_ws/src:ro
      - ../../ml/rfdetr/weights:/model:ro
      - torch-cache:/root/.cache       # rfdetr／torch 下載的檔案，避免每次重抓
    command: [ros2, run, orca_perception, detector]

  # mavros + auv_adapter（/auv_control）。水池測試腳本在這裡面跑（./pool_test.sh），
  # CSV 寫到目前場次的 pool_tests/；飛控參數快照（up.sh、down.sh）也在這裡面讀。
  # 沒有場次時 CSV 寫到 logs/no_session/（正常不會發生，只是避免寫進容器裡就消失）。
  # 第一次用之前，RPi 的 mavproxy 要先加 udpin 14560（deploy/rpi-relay/mavproxy-udpin.sh）
  fc_adapter:
    <<: [*ros, *base]
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../../src:/opt/orca_ws/src:ro
      - ../../tools:/orca/tools:ro
      - ./logs/session:/sessions
      - ./logs/no_session:/logs
    stop_grace_period: 20s
    command: [bash, /opt/orca_ws/install/orca_bridge/share/orca_bridge/bridge.sh, rpi_relay]

  # 全程錄影：所有 topic 錄成 rosbag（MCAP），錄進目前場次（讀 /sessions/current）。
  # 每次啟動開一個新資料夾 <場次>/bag_<時間>/，每 5 分鐘切一個 .mcap（斷電也只會壞最後一個檔），
  # 所以出錯結束後可以直接重開（restart）。跟其他服務一起由 ./up.sh 起；還沒有場次時（沒經 up.sh）會一直等。
  # 停止用 docker compose stop recorder（送 SIGINT，讓它把檔案收尾）；./down.sh 會做。
  # 不錄：未壓縮的影像（sensor_msgs/Image，約 100 GB／小時）。
  # 錄：front_camera 轉發的原始 JPEG（/camera/camera/color/image_raw/compressed，RPi 送來的、不重新壓縮，
  # 每秒約 1.3 MB）、object_detector 畫好框的 JPEG（/detections/image/compressed，每秒約 1.1 MB），
  # 加上 mavros、/auv_control、/detections、/rosout、/session/marker 等，合計約 9 GB／小時（相機 30 fps 時量的）。
  # 相機改成 15 fps 後兩路 JPEG 約減半，估計合計約 5 GB／小時，未實測。
  recorder:
    <<: [*ros, *base]
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 15s
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./logs/session:/sessions
    command:
      - bash
      - -c
      - >-
        until s=$$(cat /sessions/current 2>/dev/null) && [ -n "$$s" ]; do
        echo '還沒有場次（logs/session/current），等 ./up.sh 建立'; sleep 5; done;
        exec ros2 bag record -a -s mcap --max-bag-duration 300
        -x '^(/camera/camera/color/image_raw|/bottom_camera/image_raw|/detections/image|/detections/bottom_image)$$'
        -o "/sessions/$$s/bag_$$(date +%Y%m%d_%H%M%S)"

  # 標記（/session/marker，std_msgs/String「來源: 內容」）附加到目前場次的 markers.csv。
  # 標記的來源：./mark.sh、鍵盤操控的 M 鍵、行為樹與水池測試腳本開始和結束、up.sh／down.sh
  marker_log:
    <<: [*ros, *base]
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../../src:/opt/orca_ws/src:ro
      - ./logs/session:/sessions
    command: [ros2, run, orca_session, marker_log]

  # 行為樹決策層。不隨 up 啟動，用 ./mission.sh 或（要互動，列檢查清單、等 Enter）：
  #   docker compose --profile mission run --rm mission mission gate_pass
  # 即時看樹的狀態（另開終端機）：
  #   docker compose --profile mission run --rm mission py-trees-tree-watcher
  # CSV 寫到目前場次的 mission/。ORCA_GIT（程式版本，寫進開始的標記）由 mission.sh 傳進來
  mission:
    <<: *ros
    image: orca-mission
    build:
      context: ../..
      dockerfile: docker/mission.Dockerfile
      labels:
        orca.build-hash: ${ORCA_MISSION_HASH:-}
    profiles: [mission]
    environment:
      <<: *ros-env
      ORCA_TREES_DIR: /opt/orca_ws/src/orca_mission/trees
      ORCA_MISSION_CONFIG_DIR: /opt/orca_ws/src/orca_mission/config
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../../src:/opt/orca_ws/src:ro
      - ./logs/session:/sessions
      - ./logs/no_session:/logs
    stop_grace_period: 10s        # SIGTERM 時 mission 會先送 MANUAL＋DISARM 再結束
    command: [mission, gate_pass]

  # 臨時工具，不會隨 up 啟動。看畫面（主機先跑 xhost +SI:localuser:root）：
  #   docker compose run --rm gui_tools ros2 run rqt_image_view rqt_image_view /detections/image
  # 鍵盤操控（M 鍵插標記）：
  #   docker compose run --rm gui_tools python3 /orca/tools/teleop/keyboard.py
  # 從場次切出一段：./slice.sh（在這個服務裡跑 bag_slice）
  # 回放 rosbag（先 ./down.sh，避免跟現場的 topic 混在一起）：
  #   docker compose run --rm gui_tools ros2 bag play /sessions/<場次>/slices/<名稱>
  gui_tools:
    <<: [*ros, *base]
    profiles: [tools]
    environment:
      <<: *ros-env
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../../src:/opt/orca_ws/src:ro
      - ../../tools:/orca/tools:ro
      - ./logs/session:/sessions

volumes:
  torch-cache:
