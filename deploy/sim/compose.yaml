# 模擬：Gazebo 泳池 + ArduSub SITL，加上跟實機同一套 fc_adapter（只差 mavros 的 fcu_url）。
# 用 ./run.sh 啟動。實機的水池測試腳本不用改就能對模擬跑：
#   docker compose exec fc_adapter bash -ic 'python3 /orca/tools/pool_tests/water_depth.py'
# 過門（有門、相機、偵測的世界）：
#   ./mission.sh                  行為樹版（src/orca_mission/trees/gate_pass.yaml，mission 服務）
#   ./gate_pass.sh                舊版（mission/gate_pass.py，在 fc_adapter 容器裡跑）
#   sim_cameras、object_detector 在 vision profile、recorder 在 record profile、mission 在 mission profile，
#   平常的 ./run.sh 不會起它們
#
# 服務：
#   simulator        Gazebo + ArduSub SITL + mavproxy
#   fc_adapter       飛控介面：mavros + auv_adapter（/auv_control → ArduSub）。程式不改
#   sim_cameras      Gazebo 的前視、底部相機 → ROS 影像（topic、frame_id 同實機）
#   object_detector  RF-DETR：影像 → /detections、畫好框的影像（原始、JPEG）
#   recorder         每次任務錄一個 rosbag（MCAP），影像只錄畫好框的 JPEG
#   mission          行為樹決策層（orca_mission）：/detections + mavros 狀態 → /auv_control
#   gui_tools        鍵盤操控等臨時工具
name: orca-sitl

x-ros-env: &ros-env
  ROS_LOCALHOST_ONLY: "1"
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}

services:
  simulator:
    image: orca-sim
    build:
      context: ../../docker
      dockerfile: sim.Dockerfile
    network_mode: host
    init: true                    # 讓 docker stop 的 SIGTERM 送得到 start.sh
    gpus: all
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - DISPLAY=${DISPLAY:-:0}
      - ROS_LOCALHOST_ONLY=1
      - GZ_IP=127.0.0.1           # gz-transport 只走本機，不與同網段的其他 Gazebo 互通
      - GZ_PARTITION=orca_sim     # sim_cameras 要跟 simulator 同一個 partition 才看得到影像
      - WORLD=${WORLD:-orca_pool.sdf}
      - GUI=${GUI:-1}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../../sim:/sim:ro
      - ../../firmware/ardusub:/params:ro
      - ./logs/sim:/logs

  fc_adapter:
    image: orca-base
    build:
      context: ../..
      dockerfile: docker/base.Dockerfile
      # build 指紋（docker/build-hash.sh 算的），跟 deploy/laptop 共用映像，laptop 的 up.sh 靠它判斷要不要重 build
      labels:
        orca.build-hash: ${ORCA_BASE_HASH:-}
    network_mode: host            # 收 mavproxy 送到 127.0.0.1:14551 的封包
    ipc: host
    init: true
    depends_on: [simulator]
    environment:
      - ROS_LOCALHOST_ONLY=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../../src:/opt/orca_ws/src:ro
      - ../../tools:/orca/tools:ro
      - ../../mission:/orca/mission:ro
      - ./logs/fc_adapter:/logs
    stop_grace_period: 20s
    command: [bash, /opt/orca_ws/install/orca_bridge/share/orca_bridge/bridge.sh, sitl]

  # 臨時工具，不會隨 up 啟動。鍵盤操控（主機先跑 xhost +SI:localuser:root，./run.sh 會跑）：
  #   docker compose run --rm gui_tools python3 /orca/tools/teleop/keyboard.py
  gui_tools:
    image: orca-base
    profiles: [tools]
    network_mode: host
    ipc: host
    init: true
    environment:
      - ROS_LOCALHOST_ONLY=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - DISPLAY=${DISPLAY:-:0}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../../src:/opt/orca_ws/src:ro
      - ../../tools:/orca/tools:ro

  # Gazebo 相機（sim/models/orca_cam）→ ROS，topic、frame_id 跟實機一樣：
  #   前視 /camera/camera/color/image_raw、camera_info；底部 /bottom_camera/image_raw、camera_info
  # 世界檔要用有相機的（orca_qgate.sdf、orca_gate.sdf）
  sim_cameras:
    image: orca-sim
    profiles: [vision]
    network_mode: host
    ipc: host
    init: true
    depends_on: [simulator]
    environment:
      <<: *ros-env
      GZ_IP: 127.0.0.1
      GZ_PARTITION: orca_sim
    volumes:
      - ../../sim:/sim:ro
    command: [python3, -u, /sim/gz_camera_bridge.py]

  # 跟實機同一個 RF-DETR 節點：前視、底部影像 → /detections（frame_id 分辨相機）。
  # 權重先跑 ml/rfdetr/fetch_weights.sh
  object_detector:
    image: orca-perception
    build:
      context: ../..
      dockerfile: docker/perception-x86.Dockerfile
      labels:
        orca.build-hash: ${ORCA_PERCEPTION_HASH:-}
    profiles: [vision]
    network_mode: host
    ipc: host
    init: true
    gpus: all
    environment:
      <<: *ros-env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../../src:/opt/orca_ws/src:ro
      - ../../ml/rfdetr/weights:/model:ro
      - torch-cache:/root/.cache
    command: [ros2, run, orca_perception, detector]

  # 把 topic 錄成 rosbag（MCAP），一個資料夾一次任務：./mission.sh 跑樹前開、樹結束且船浮上水面後停，
  # 存在 logs/bag/<樹>_<時間>/，跟 logs/mission/<樹>_<時間>.csv 同名（RECORD=0 ./mission.sh 不錄）。
  # 影像只錄畫好框的 JPEG（/detections/image/compressed、/detections/bottom_image/compressed），
  # 相機的原始影像（含其他壓縮格式）、畫好框的原始影像都不錄，一次過門（約 30 秒）約 12 MB。
  # 單獨錄（不經 mission.sh）：BAG_NAME=名稱 docker compose --profile record up -d recorder；
  # 停止用 docker compose stop recorder（送 SIGINT，讓它把檔案收尾）。用 Foxglove 直接開 .mcap。
  recorder:
    image: orca-base              # 跟 fc_adapter 同一個 image（mission.sh 會先 build）
    profiles: [record]
    network_mode: host
    ipc: host
    init: true
    stop_signal: SIGINT
    stop_grace_period: 15s
    environment:
      <<: *ros-env
      BAG_NAME: ${BAG_NAME:-}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./logs/bag:/bags
    command:
      - bash
      - -c
      - >-
        exec ros2 bag record -a -s mcap
        -x '^(/camera/camera/color/image_raw.*|/bottom_camera/image_raw.*|/detections/image|/detections/bottom_image)$$'
        -o /bags/$${BAG_NAME:-$$(date +%Y%m%d_%H%M%S)}

  # 行為樹決策層。不隨 up 啟動，用 ./mission.sh 或：
  #   docker compose --profile mission run --rm mission mission smoke_test --no-checklist
  # 改了 trees/*.yaml、config/、.py 不用重 build（src/ 掛進容器）；新增 .py 檔或改 setup.py 才要。
  # 即時看樹的狀態（另開終端機）：
  #   docker compose --profile mission run --rm mission py-trees-tree-watcher
  mission:
    image: orca-mission
    build:
      context: ../..
      dockerfile: docker/mission.Dockerfile
      labels:
        orca.build-hash: ${ORCA_MISSION_HASH:-}
    profiles: [mission]
    network_mode: host
    ipc: host
    init: true
    environment:
      <<: *ros-env
      ORCA_TREES_DIR: /opt/orca_ws/src/orca_mission/trees
      ORCA_MISSION_CONFIG_DIR: /opt/orca_ws/src/orca_mission/config
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../../src:/opt/orca_ws/src:ro
      - ./logs/mission:/logs
    stop_grace_period: 10s        # SIGTERM 時 mission 會先送 MANUAL＋DISARM 再結束
    command: [mission, gate_pass, --no-checklist]

volumes:
  torch-cache:
