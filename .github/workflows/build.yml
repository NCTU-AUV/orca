# 每次 push、PR：在 ROS 2 Humble 裡 colcon build，檢查 tools、mission 的 Python 語法，跑過門流程與行為樹的測試
name: build

on:
  push:
  pull_request:

jobs:
  colcon:
    runs-on: ubuntu-latest
    container: ros:humble
    steps:
      - uses: actions/checkout@v4
      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --event-handlers console_direct+
      - name: python syntax
        run: python3 -m py_compile tools/pool_tests/*.py tools/teleop/*.py deploy/rpi-relay/cam_relay.py mission/*.py sim/gz_camera_bridge.py sim/arena/*.py
      # SAUVC 2027 場地：sim/models/sauvc27_*、sim/worlds/sauvc27_* 要跟產生器（sim/arena/sauvc2027.py）的輸出一致
      - name: arena files up to date
        run: |
          cp -r sim /tmp/sim_before
          python3 sim/arena/sauvc2027.py > /dev/null
          diff -r /tmp/sim_before sim || { echo '請執行 python3 sim/arena/sauvc2027.py 後再 commit'; exit 1; }
      - name: mission tests
        run: python3 mission/test_gate_pass.py
      # 行為樹：執行器、TaskRunner、YAML 載入、過門流程（平面模型），以及 trees/*.md 跟 YAML 一致
      - name: orca_mission tests
        shell: bash
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            ros-humble-py-trees python3-pytest python3-yaml
          source /opt/ros/humble/setup.bash
          cd src/orca_mission && python3 -m pytest -q test
